<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>404 — ZIVO Travel Review</title>
<style>
  :root{ --bg:#f5f7fa; --card:#fff; --ink:#141a22; --mut:#5b6673; --line:#e3e7ee; --brand:#2456c9; --warn:#a9701a; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0e1116; --card:#171c24; --ink:#eef2f7; --mut:#9aa5b3; --line:#262d38; --brand:#7aa2f7; --warn:#e0b25a; } }
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .banner{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#1a1205;font-size:.8rem;font-weight:600;padding:7px 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;max-width:460px;margin:14px}
  .big{font-size:2.6rem;margin:0 0 6px}
  a{color:var(--brand)}
</style>
</head>
<body>
  <div class="banner">Environment: Review · Demo data only · Actions disabled</div>
  <div class="card">
    <div class="big">404</div>
    <h1>Route not found</h1>
    <p style="color:var(--mut)">This is the ZIVO Travel <strong>Review</strong> demo. Only the demo screens are served — no application routes, no data, no actions.</p>
    <p><a href="/index.html#search">Go to the Review demo</a></p>
  </div>
</body>
</html>
